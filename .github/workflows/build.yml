name: build
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Giai nen zip
        run: unzip -q bakhi-mod-26.2.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Build mod jar
        working-directory: bakhi-mod
        run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: bakhi-jar
          path: |
            bakhi-mod/build/libs/*.jar
            !bakhi-mod/build/libs/*-sources.jar
